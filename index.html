<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>(:3」∠)</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="toolbar">
    <h1>Absolute Cinema</h1>
    <button id="btn-theme" class="icon-btn ripple" title="切換淺色 / 深色模式" aria-label="切換淺色 / 深色模式">
      <svg class="icon-moon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12.3 22a10 10 0 0 1-.3-20 8 8 0 0 0 10 10A10 10 0 0 1 12.3 22z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM2 13h2a1 1 0 0 0 0-2H2a1 1 0 0 0 0 2zm18 0h2a1 1 0 0 0 0-2h-2a1 1 0 0 0 0 2zM11 2v2a1 1 0 0 0 2 0V2a1 1 0 0 0-2 0zm0 18v2a1 1 0 0 0 2 0v-2a1 1 0 0 0-2 0zM5.99 4.58a1 1 0 0 0-1.41 1.41l1.06 1.06a1 1 0 0 0 1.41-1.41L5.99 4.58zm12.37 12.37a1 1 0 0 0-1.41 1.41l1.06 1.06a1 1 0 0 0 1.41-1.41l-1.06-1.06zm1.06-10.96a1 1 0 0 0-1.41-1.41l-1.06 1.06a1 1 0 0 0 1.41 1.41l1.06-1.06zM7.05 18.36a1 1 0 0 0-1.41-1.41l-1.06 1.06a1 1 0 0 0 1.41 1.41l1.06-1.06z"/></svg>
    </button>
  </header>

  <main class="page">
    <section class="card">
      <h2>你好</h2>
      <p>👍</p>
    </section>
    <section class="card">
      <h2>h2</h2>
      <p>paragraph, <strong>strong</strong>, <em>em</em>, <a href="">a</a>, <code>code</code>, <mark>mark</mark>, <del>del</del>, <small>small</small>, <kbd>key</kbd></p>
      <h3>h3</h3>
      <ul>
        <li>li1</li>
        <li>li2
          <ul>
            <li>li1</li>
          </ul>
        </li>
      </ul>
      <ol>
        <li>li1</li>
        <li>li2</li>
      </ol>
      <h4>h4</h4>
      <blockquote><p>blockquote</p></blockquote>
      <pre><code>function hello() {
  console.log('Bye bye');
}</code></pre>
      <hr>
      <table>
        <thead><tr><th>th1</th><th>th2</th></tr></thead>
        <tbody>
          <tr><td>abc</td><td>123</td></tr>
          <tr><td>def</td><td>456</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <button id="btn-top" class="fab ripple" title="回到頂端" aria-label="回到頂端">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M12 8l-6 6 1.4 1.4L12 10.8l4.6 4.6L18 14z"/></svg>
  </button>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/app.js"></script>

</html>
